<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>xCollab — Ink Theory</title>
<meta name="description" content="Where music, culture, and high fashion intersect. Limited-edition collections created with artists.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta property="og:title" content="xCollab — Ink Theory">
<meta property="og:description" content="Where music, culture, and high fashion intersect.">
<meta name="theme-color" content="#f7f7f8">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Inter:wght@300;400&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/xcollab/xcollab.css?v=mvl998hu">
</head>
<body>
<div class="xc" id="xc">
  <nav class="nav" aria-label="xCollab">
    <button type="button" data-panel="artists">Artists</button>
    <button type="button" data-panel="collection">Collection</button>
    <button type="button" data-panel="concept">Concept</button>
  </nav>
  <div class="mark" aria-label="xCollab">x</div>
  <div class="who" id="who" hidden>Artist:<span id="whoName"></span></div>

  <div class="stage" id="stage">
    <h1 class="word" id="word" aria-label="Collab"><span>COL</span><span>LAB</span></h1>
    <div class="track" id="track"></div>
    <!-- same word again above the models with COL hidden: COL stands behind the model, LAB in front -->
    <div class="word front" id="wordFront" aria-hidden="true"><span class="ghost">COL</span><span>LAB</span></div>
    <div class="msg" id="msg" hidden></div>
  </div>

  <p class="lede" id="lede">Where music, culture, and high fashion intersect. <br>Limited-edition collections created with artists, designed to turn the <br>connection between artist and fan into something you can wear, feel, and remember.</p>

  <div class="caption" id="caption" aria-live="polite">
    <div class="cap-name" id="capName"></div>
    <div class="cap-artist" id="capArtist"></div>
    <div class="cap-count" id="capCount"></div>
  </div>

  <div class="panel" id="panel" aria-hidden="true">
    <button type="button" class="panel-x" id="panelX" aria-label="Close">Close</button>
    <div class="panel-body" id="panelBody"></div>
  </div>
</div>
<script src="/xcollab/xcollab-config.js?v=mvl998hu"></script>
<script src="/xcollab/xcollab.js?v=mvl998hu"></script>
</body>
</html>
